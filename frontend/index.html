    <header class="navbar">
        <div class="actions-container">
            <button class="login-btn">
                <span>התחברות</span>

            <button class="semester-btn" dir="rtl">

                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                סמסטר א׳
                <svg class="semester-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                     fill="currentColor">
                    <path fill-rule="evenodd"
                          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"

        </div>

                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            
            <a href="/" class="logo-link">
                        <span class="logo-text">
                            Review
                            <span class="logo-highlight">Platform</span>
                        </span>
            </a>
        </div>
    </header>
    
    
    <div class="main-container" dir="ltr">
        <div class="calendar-container" dir="rtl"></div>
        
        <div class="sidebar-container">
